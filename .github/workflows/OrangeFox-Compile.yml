name: Build OFR

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'OrangeFox Manifest URL'
        required: true
        default: 'https://github.com/OrangeFoxRecovery/Manifest.git'
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/ofektheking123456/device_xiaomi_tanzanite'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device Path'
        required: true
        default: 'device/xiaomi/tanzanite'
      DEVICE_NAME:
        description: 'Device Name'
        required: true
        default: 'tanzanite'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clean Environment
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        
    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize & Sync OrangeFox Source
      run: |
        mkdir -p ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        cd ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all)

    - name: Clone Device Tree
      run: |
        cd ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        
        # Determine target path safely
        TARGET_DIR="${{ inputs.DEVICE_PATH }}"
        [[ "$TARGET_DIR" != device/* ]] && TARGET_DIR="device/$TARGET_DIR"
        
        # Copy device tree files from current repository workspace
        mkdir -p "$TARGET_DIR"
        cp -r ${{ github.workspace }}/* "$TARGET_DIR"/ 2>/dev/null || true
        rm -rf "$TARGET_DIR/OrangeFox" "$TARGET_DIR/.github"

    - name: Building OrangeFox
      run: |
        cd ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL="C"
        
        # Determine prefix (defaults to 'omni' if input is blank)
        PREFIX="${{ inputs.MAKEFILE_NAME }}"
        [ -z "$PREFIX" ] && PREFIX="omni"
        
        # Lunch target product
        lunch ${PREFIX}_${{ inputs.DEVICE_NAME }}-eng || lunch ${PREFIX}_${{ inputs.DEVICE_NAME }}-userdebug
        
        # Compile OrangeFox recovery
        mka recoveryimage -j$(nproc --all) || mka bootimage -j$(nproc --all)

    - name: Find Compiled Outputs
      run: |
        OUT_DIR="${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out"
        echo "=== ALL GENERATED RECOVERY / ZIP FILES ==="
        find $OUT_DIR -type f \( -name "*.img" -o -name "*.zip" \) -not -path "*/obj/*"
        
        # Grab first zip and img found anywhere inside out/
        FOUND_ZIP=$(find $OUT_DIR -type f -name "*.zip" -not -path "*/obj/*" | head -n 1)
        FOUND_IMG=$(find $OUT_DIR -type f -name "*.img" -not -path "*/obj/*" | head -n 1)
        
        echo "FOUND_ZIP=$FOUND_ZIP" >> $GITHUB_ENV
        echo "FOUND_IMG=$FOUND_IMG" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'workflow_dispatch'
      with:
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/boot.img
        name: OrangeFox Recovery for ${{ inputs.DEVICE_NAME }}
        tag_name: ${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
        body: |
          ## OrangeFox Recovery Build
          * **Device:** ${{ inputs.DEVICE_NAME }}
          * **Manifest Branch:** ${{ inputs.MANIFEST_BRANCH }}
          * **Build ID:** ${{ github.run_id }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
